---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/user-service:latest # Placeholder
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: ecommerce-config
        - secretRef:
            name: ecommerce-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ecommerce
spec:
  ports:
  - port: 3001
  selector:
    app: user-service
---
# Replicate similar structure for product-service, cart-service, order-service, payment-service, notification-service
# (Simplified for brevity, normally each service gets its own block similar to user-service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
      - name: product-service
        image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/product-service:latest
        ports:
        - containerPort: 3002
        envFrom:
        - configMapRef:
            name: ecommerce-config
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce
spec:
  ports:
  - port: 3002
  selector:
    app: product-service
